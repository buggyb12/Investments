[phases.setup]
# Vite 8 vyžaduje Node 20.19+ / 22.12+; nodejs_22 má bundlované npm.
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  # Čistá instalace přesně podle package-lock.json — řeší npm bug
  # s optional dependencies (chybějící @rolldown/binding-linux-x64-gnu).
  "rm -rf node_modules",
  "npm ci --no-audit --no-fund"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
